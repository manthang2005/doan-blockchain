<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập | Blockchain Voting</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="login-page">
    <div class="login-box">

        <div class="login-left">
            <div class="stripe-panel"></div>
        </div>

        <div class="login-right">
            <div class="login-form-box">
                <div class="login-logo">

                    <div class="login-logo-text">Blockchain Voting</div>
                </div>

                <h2>Chào mừng trở lại!</h2>
                <p class="login-subtitle">
                    Đăng nhập để tham gia bỏ phiếu hoặc quản trị hệ thống.
                </p>

                {% if error %}
                    <p class="error">{{ error }}</p>
                {% endif %}

                <form method="POST">
                    <div class="form-group">
                        <input 
                            type="text" 
                            name="username" 
                            placeholder="Tên tài khoản" 
                            required
                        >
                    </div>

                    <div class="form-group">
                        <input 
                            type="password" 
                            name="password" 
                            placeholder="Mật khẩu" 
                            required
                        >
                    </div>

                    <div class="login-options">
                        <label class="remember-line">
                            <input type="checkbox">
                            <span>Ghi nhớ đăng nhập</span>
                        </label>

                        <span class="fake-link">Quên mật khẩu?</span>
                    </div>

                    <button class="login-btn" type="submit">Đăng nhập</button>
                </form>

                <p class="signup-text">
                    Chưa có tài khoản?
                    <a href="/register">Đăng ký</a>
                </p>


            </div>
        </div>

    </div>
</div>

</body>
</html>
