<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký | Blockchain Voting</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="auth-wrapper">
    <div class="auth-card">
        <div class="logo-box">
            <div class="logo-icon">B</div>
            <div>
                <h1 class="logo-title">Blockchain Voting</h1>
                <p class="logo-subtitle">Tạo tài khoản người bỏ phiếu</p>
            </div>
        </div>

        <h2>Đăng ký tài khoản</h2>
        <p class="desc">
            Tài khoản mới sẽ được phân quyền là <b>voter</b> và chỉ có thể tham gia bỏ phiếu.
        </p>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST">
            <div class="form-group">
                <label>Tên tài khoản</label>
                <input type="text" name="username" placeholder="Nhập tài khoản" required>
            </div>

            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" name="password" placeholder="Nhập mật khẩu" required>
            </div>

            <div class="form-group">
                <label>Nhập lại mật khẩu</label>
                <input type="password" name="confirm_password" placeholder="Nhập lại mật khẩu" required>
            </div>

            <button class="btn btn-full" type="submit">Tạo tài khoản</button>
        </form>

        <div class="note-box">
            <p>Đã có tài khoản?</p>
            <a class="btn btn-outline btn-full" href="/login">Quay lại đăng nhập</a>
        </div>
    </div>
</div>

</body>
</html>
